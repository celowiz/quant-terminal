name: live

# Watcher leve do tempo real (fase 2): em dias úteis, 07:00–22:00 BRT, busca a cada poucos minutos o que o
# navegador não alcança (cotações mundiais com atraso, comunicados oficiais, fatos relevantes, avisos da bolsa,
# séries dos EUA com a chave em segredo) e publica arquivos pequenos no branch órfão `live` — um único commit,
# force-push, só quando o conteúdo muda. O site lê esses arquivos e cai no retrato diário se faltarem.
#
# Encadeamento: cada execução roda até ~5h40 (ou até 22:00) e, se ainda estiver na janela, dispara a próxima
# (workflow_dispatch com o GITHUB_TOKEN) — também quando o watcher falha depois de 15 min rodando; uma falha rápida
# não encadeia (evita laço) e a próxima execução da rede de segurança reinicia o encadeamento. Porteiro:
# pipeline/live_gate.sh (janela, uma execução por vez, espera até 07:00 quando chega entre 05:00 e 07:00).
on:
  workflow_dispatch:
    inputs:
      after:
        description: 'execução anterior do encadeamento (ainda terminando; não conta como ativa)'
        required: false
        default: '0'
  # rede de segurança a cada 20 min (seg–sáb UTC); cada execução fora da janela sai em segundos, e entre 05:00 e
  # 07:00 BRT a primeira que chegar espera até 07:00 (início do dia sem depender de um cron pontual)
  schedule:
    - cron: '7,27,47 * * * 1-6'

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # só o branch `live` (force-push de um commit órfão)
      actions: write    # disparar a próxima execução do encadeamento
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      AFTER: ${{ inputs.after || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            pipeline/live_watch.py
            pipeline/live_gate.sh
          sparse-checkout-cone-mode: false
      - name: Janela (dias úteis 07:00–22:00 BRT; espera desde 05:00) e uma execução por vez
        id: gate
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          bash pipeline/live_gate.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: '3.12'
      - name: Dependência
        if: steps.gate.outputs.go == 'true'
        run: pip install --quiet 'requests==2.34.2'
      - name: Estado atual do branch live
        if: steps.gate.outputs.go == 'true'
        run: |
          mkdir live-out && cd live-out && git init -q
          git remote add origin "https://github.com/$REPO.git"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if git fetch -q --depth 1 origin live; then git checkout -q FETCH_HEAD -- . && ls -la; else echo "branch live ainda não existe"; fi
      - name: Watcher
        id: watch
        if: steps.gate.outputs.go == 'true'
        env:
          QT_LIVE_DIR: live-out
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SLEPT: ${{ steps.gate.outputs.slept }}
        run: QT_LIVE_MAX_S=$((20400 - ${SLEPT:-0})) python pipeline/live_watch.py
      - name: Próxima execução (se ainda estiver na janela)
        if: ${{ !cancelled() && steps.gate.outputs.go == 'true' }}
        env:
          OUTCOME: ${{ steps.watch.outcome }}
          START: ${{ steps.gate.outputs.start }}
          SLEPT: ${{ steps.gate.outputs.slept }}
        run: |
          ran=$(( $(date +%s) - ${START:-0} - ${SLEPT:-0} ))
          if [ "$OUTCOME" != success ] && [ "$ran" -lt 900 ]; then echo "watcher falhou após ${ran}s: sem encadear (a rede de segurança reinicia)"; exit 0; fi
          dow=$(TZ=America/Sao_Paulo date +%u); hm=$(TZ=America/Sao_Paulo date +%H%M)
          if [ "$dow" -le 5 ] && [ "$hm" -ge 0700 ] && [ "$hm" -lt 2150 ]; then gh workflow run live.yml -R "$REPO" --ref main -f after=${{ github.run_id }} && echo "próxima disparada"; else echo "janela encerrada"; fi
