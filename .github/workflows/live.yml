name: live

# Watcher leve do tempo real (fase 2): em dias úteis, 07:00–22:00 BRT, busca a cada poucos minutos o que o
# navegador não alcança (cotações mundiais com atraso, comunicados oficiais, fatos relevantes, avisos da bolsa,
# séries dos EUA com a chave em segredo) e publica arquivos pequenos no branch órfão `live` — um único commit,
# force-push, só quando o conteúdo muda. O site lê esses arquivos e cai no retrato diário se faltarem.
#
# Encadeamento: cada execução na janela roda até ~5h10 e dispara a próxima (workflow_dispatch com o
# GITHUB_TOKEN) — também quando o watcher falha depois de 15 min rodando; uma falha rápida não encadeia
# (evita laço) e a próxima execução da rede de segurança reinicia. Ao fim da janela (22:00 BRT), em vez
# de sair, dispara uma espera noturna (mode=standby): dorme em blocos de ~5h05 (abaixo do limite de 6 h
# do Actions; um único passo de sono, sem Python nem branch live) até as 07:00 do próximo dia útil —
# sexta à noite encadeia até segunda 07:00. A última espera dorme o restante e vira o watcher. O próximo
# elo é disparado ~15 min antes do fim do sono, com novas tentativas se a execução não ficar in_progress
# (startup_failure). Porteiro: pipeline/live_gate.sh (janela, uma execução por vez, espera até 07:00
# quando alcança a abertura neste job). Rede de segurança a cada 20 min (seg–sáb UTC): se já houver
# espera ou watcher ativo, sai em segundos; se a cadeia tiver morrido, retoma a espera (ou o watcher).
on:
  workflow_dispatch:
    inputs:
      after:
        description: 'execução anterior do encadeamento (ainda terminando; não conta como ativa)'
        required: false
        default: '0'
      mode:
        description: 'watch = janela diurna; standby = espera noturna até 07:00 do próximo dia útil'
        required: false
        default: watch
        type: choice
        options: [watch, standby]
  # rede de segurança a cada 20 min (seg–sáb UTC); cada execução com outra já ativa sai em segundos
  schedule:
    - cron: '7,27,47 * * * 1-6'

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # só o branch `live` (force-push de um commit órfão)
      actions: write    # disparar a próxima execução do encadeamento
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      AFTER: ${{ inputs.after || '0' }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            pipeline/live_watch.py
            pipeline/live_gate.sh
            pipeline/live_chain.sh
          sparse-checkout-cone-mode: false
      - name: Janela (dias úteis 07:00–22:00 BRT; espera noturna ou até 07:00) e uma execução por vez
        id: gate
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          bash pipeline/live_gate.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: '3.12'
      - name: Dependência
        if: steps.gate.outputs.go == 'true'
        run: pip install --quiet 'requests==2.34.2'
      - name: Estado atual do branch live
        if: steps.gate.outputs.go == 'true'
        run: |
          mkdir live-out && cd live-out && git init -q
          git remote add origin "https://github.com/$REPO.git"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if git fetch -q --depth 1 origin live; then git checkout -q FETCH_HEAD -- . && ls -la; else echo "branch live ainda não existe"; fi
      - name: Watcher
        id: watch
        if: steps.gate.outputs.go == 'true'
        env:
          QT_LIVE_DIR: live-out
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SLEPT: ${{ steps.gate.outputs.slept }}
        run: |
          # 5h10 de watcher deixa ~40 min no timeout de 350 min para o disparo com novas tentativas
          max=$((18600 - ${SLEPT:-0}))
          [ "$max" -lt 600 ] && max=600
          QT_LIVE_MAX_S=$max python pipeline/live_watch.py
      - name: Próxima execução (janela, ou espera noturna)
        if: ${{ !cancelled() && (steps.gate.outputs.go == 'true' || steps.gate.outputs.standby == 'true') }}
        env:
          OUTCOME: ${{ steps.watch.outcome }}
          START: ${{ steps.gate.outputs.start }}
          SLEPT: ${{ steps.gate.outputs.slept }}
          STANDBY: ${{ steps.gate.outputs.standby }}
          STANDBY_SLEEP: ${{ steps.gate.outputs.sleep_s }}
          NEXT_MODE: ${{ steps.gate.outputs.next_mode }}
        run: |
          if [ "$STANDBY" = true ]; then
            echo "espera noturna ${STANDBY_SLEEP}s, depois dispara mode=${NEXT_MODE:-standby}"
            sleep "$STANDBY_SLEEP"
            bash pipeline/live_chain.sh "${NEXT_MODE:-standby}"
            exit 0
          fi
          ran=$(( $(date +%s) - ${START:-0} - ${SLEPT:-0} ))
          if [ "$OUTCOME" != success ] && [ "$ran" -lt 900 ]; then echo "watcher falhou após ${ran}s: sem encadear (a rede de segurança reinicia)"; exit 0; fi
          dow=$(TZ=America/Sao_Paulo date +%u); hm=$(TZ=America/Sao_Paulo date +%H%M)
          if [ "$dow" -le 5 ] && [ "$hm" -ge 0700 ] && [ "$hm" -lt 2150 ]; then
            bash pipeline/live_chain.sh watch
          else
            echo "janela encerrada ($dow $hm BRT): dispara espera noturna"
            bash pipeline/live_chain.sh standby
          fi
