# quant-terminal → GitHub Pages (custo zero).
# 1) roda o pipeline de dados (fontes abertas: Yahoo, CVM, B3, BCB, FRED, RSS)
# 2) abre issue se alguma regra de alerts.yaml disparou (ALERT)
# 3) build estático do Next.js (output: 'export') e publica no Pages.
# Horário: 10:47 UTC = 07:47 BRT, ter–sáb (dados do pregão de seg–sex já consolidados).
# Minuto :47 escolhido para evitar picos do Actions e os minutos já usados (:04 :07 :09 :11 :13 :17 :23 :34 :39 :41).
name: pages

on:
  push:
    branches: [main]
  # PR: só valida typecheck + build (sem pipeline, sem issue, sem deploy)
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '47 10 * * *'   # todo dia (CAL checa os sites de RI diariamente)

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  pr-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_BASE_PATH: /quant-terminal
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Testes do pipeline (pytest)
        run: |
          pip install -r pipeline/requirements.txt
          python -m pytest -q tests
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Lint + typecheck + build (seed public/data/tickers.json)
        run: |
          npm ci
          npm run lint
          npm test
          npx tsc --noEmit -p .
          npx next build
          test -f out/index.html
          ! grep -ril bloomberg out/

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QT_DATA_OUT: ${{ github.workspace }}/public/data
      QT_CACHE: ${{ github.workspace }}/.qt_cache
      QT_ALERTS: ${{ github.workspace }}/alerts.yaml
      QT_ALERTS_MD: /tmp/alerts_fired.md
      NEXT_PUBLIC_BASE_PATH: /quant-terminal
      NEXT_TELEMETRY_DISABLED: '1'
      # logs do pipeline em tempo real (sem buffer), p/ ver onde um passo trava
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Dependências Python (versões fixas)
        run: pip install -r pipeline/requirements.txt

      # Chave do cache por semana ISO: antes era por run_id e salvava ~150 MB novos a cada execução.
      - name: Chave do cache (semana)
        id: week
        run: echo "week=$(TZ=America/Sao_Paulo date +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Cache dos downloads grandes (CVM DFP/ITR, COTAHIST) entre execuções.
      - uses: actions/cache@v6
        with:
          path: .qt_cache
          key: qt-cache-v2-${{ steps.week.outputs.week }}
          restore-keys: |
            qt-cache-v2-
            qt-cache-

      - name: Pipeline de dados
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: bash pipeline/run_all.sh

      - name: Testes dos dados gerados (pytest)
        run: python -m pytest -q tests

      - name: Issue de alerta (ALERT)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/alerts_fired.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "ALERT $(TZ=America/Sao_Paulo date +%Y-%m-%d): regras disparadas" \
              --body-file /tmp/alerts_fired.md --label alert || \
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "ALERT $(TZ=America/Sao_Paulo date +%Y-%m-%d): regras disparadas" \
              --body-file /tmp/alerts_fired.md
          else
            echo "Nenhum alerta disparado."
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Lint + testes + build estático
        run: |
          npm ci
          npm run lint
          npm test
          npx next build
          touch out/.nojekyll
          ! grep -ril bloomberg out/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
