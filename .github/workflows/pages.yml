# quant-terminal → GitHub Pages (custo zero).
# 1) roda o pipeline de dados (fontes abertas: Yahoo, CVM, B3, BCB, FRED, RSS)
# 2) abre issue se alguma regra de alerts.yaml disparou (ALERT)
# 3) build estático do Next.js (output: 'export') e publica no Pages.
# Horário: 10:47 UTC = 07:47 BRT, ter–sáb (dados do pregão de seg–sex já consolidados).
# Segundo build: 22:30 UTC = 19:30 BRT, seg–sex, para o fechamento oficial B3 do próprio dia. O arquivo diário
# oficial costuma sair entre 20:20 e 21:40 BRT, então esse build espera por ele (até 150 min) antes do pipeline;
# se não sair (feriado, atraso), segue com o que houver e a data de referência mostra a última barra oficial.
# O CAL (calendário de resultados) tem um job leve próprio, todo dia às 21:30 BRT: calendar.yml.
# Push que só muda o frontend (nada em pipeline/, tests/, alerts.yaml ou neste workflow) não roda o pipeline:
# reaproveita os dados do último site publicado (artefato github-pages) e faz só o build (~3 min em vez de ~30).
# Commit vazio (nenhum arquivo no compare, ex. "chore: retrigger pages deploy") também é só frontend.
# Nas execuções completas os dados publicados também são restaurados antes do pipeline, para o load_prev()
# manter o último valor bom quando uma fonte falha (antes o runner começava sem public/data).
# Minuto :47 escolhido para evitar picos do Actions e os minutos já usados (:04 :07 :09 :11 :13 :17 :23 :34 :39 :41).
name: pages

on:
  push:
    branches: [main]
  # PR: só valida typecheck + build (sem pipeline, sem issue, sem deploy)
  pull_request:
    branches: [main]
  # slot: disparo do watcher (live.yml) no horário de um dos crons abaixo — o cron atrasado é pulado (job gate)
  workflow_dispatch:
    inputs:
      slot:
        description: 'horário do build diário que este disparo substitui (morning = 07:47, evening = 19:30 BRT); manual = disparo à mão'
        required: false
        default: manual
        type: choice
        options: [manual, morning, evening]
  schedule:
    - cron: '47 10 * * 2-6'
    - cron: '30 22 * * 1-5'   # build da noite (fechamento oficial do dia); ver "Fechamento oficial do dia"

# Menor privilégio: nada no nível do workflow; cada job pede só o que usa.
permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  pr-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_BASE_PATH: /quant-terminal
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # o token não fica no .git/config para os passos seguintes (npm ci, pipeline)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Testes do pipeline (pytest)
        run: |
          pip install -r pipeline/requirements.txt
          python -m pytest -q tests
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Lint + typecheck + build (seed public/data/tickers.json)
        run: |
          npm ci
          npm run lint
          npm test
          npx tsc --noEmit -p .
          npx next build
          node scripts/csp.mjs out
          node scripts/sw.mjs out
          test -f out/index.html
          ! grep -ril bloomberg out/

  # O agendamento deste repo costuma atrasar horas. O watcher (live.yml) dispara este workflow no horário certo;
  # quando o cron atrasado chega depois de um disparo bem-sucedido (ou em andamento) para o mesmo horário, não refaz o build.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          SCHED: ${{ github.event.schedule }}
        run: |
          if [ "$SCHED" = '30 22 * * 1-5' ]; then hm='22:30'; else hm='10:47'; fi
          t=$(date -u -d "today $hm" +%s); [ "$t" -gt "$(date -u +%s)" ] && t=$((t - 86400))
          since=$(date -u -d "@$((t - 3600))" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w pages.yml --event workflow_dispatch --limit 20 --json createdAt,status,conclusion \
            -q "[.[] | select(.createdAt >= \"$since\") | select(.conclusion == \"success\" or .status != \"completed\")] | length" || echo 0)
          skip=false; if [ "${n:-0}" -gt 0 ]; then skip=true; echo "build deste horário já disparado pelo watcher ($n desde $since): cron atrasado pulado"; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: [gate]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 90 do build + até 150 de espera pelo arquivo oficial no build da noite
    permissions:
      contents: read
      actions: read      # baixar o artefato do último deploy (dados publicados)
      issues: write      # issue de alerta (ALERT)
    env:
      QT_DATA_OUT: ${{ github.workspace }}/public/data
      QT_CACHE: ${{ github.workspace }}/.qt_cache
      QT_ALERTS: ${{ github.workspace }}/alerts.yaml
      QT_ALERTS_MD: /tmp/alerts_fired.md
      NEXT_PUBLIC_BASE_PATH: /quant-terminal
      NEXT_TELEMETRY_DISABLED: '1'
      # logs do pipeline em tempo real (sem buffer), p/ ver onde um passo trava
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # o token não fica no .git/config para os passos seguintes (npm ci, pipeline)

      # Dados do último site publicado (mesmo artefato que o calendar.yml usa) → public/data
      - name: Dados publicados (último artefato github-pages)
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=30" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].id // empty' || true)
          if [ -n "$id" ] && gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > /tmp/site.zip \
             && mkdir -p /tmp/a /tmp/site && unzip -q /tmp/site.zip -d /tmp/a && tar -xf /tmp/a/artifact.tar -C /tmp/site \
             && test -f /tmp/site/data/universe.json; then
            cp -r /tmp/site/data/. public/data/
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "base: artefato $id ($(ls public/data | wc -l) itens em public/data)"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::sem artefato github-pages válido: pipeline completo"
          fi

      # ECTR e TAYL saem do slow.yml (artefato slow-data, mais novo que o do último deploy): sobrepõe e o pipeline as pula.
      - name: Fontes lentas (último artefato slow-data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=slow-data&per_page=30" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].id // empty' || true)
          if [ -n "$id" ] && gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > /tmp/slow.zip \
             && mkdir -p /tmp/slow && unzip -qo /tmp/slow.zip -d /tmp/slow; then
            for f in ectr.json tayl.json; do
              if python3 -c "import json,sys; json.load(open(sys.argv[1]))" "/tmp/slow/$f" 2>/dev/null; then cp "/tmp/slow/$f" public/data/; fi
            done
            echo "slow-data: artefato $id"
          else
            echo "sem artefato slow-data: ECTR/TAYL ficam como no último deploy"
          fi

      - name: Modo (pipeline completo ou só frontend)
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          BASE_OK: ${{ steps.base.outputs.ok }}
        run: |
          full=true
          if [ "$EVENT" = push ] && [ "$BASE_OK" = true ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null); then
              echo "$files"
              # Lista vazia = commit vazio (retrigger de deploy): só frontend.
              if [ -z "$files" ] || ! echo "$files" | grep -qE '^(pipeline/|tests/|alerts\.yaml$|public/data/|\.github/workflows/pages\.yml$)'; then full=false; fi
            else
              echo PIPELINE
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [ "$full" = true ]; then echo "Modo: pipeline completo"; else echo "Modo: só frontend (dados do último deploy)"; fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Dependências Python (versões fixas)
        run: pip install -r pipeline/requirements.txt

      # Chave do cache por semana ISO: antes era por run_id e salvava ~150 MB novos a cada execução.
      - name: Chave do cache (semana)
        if: steps.mode.outputs.full == 'true'
        id: week
        run: echo "week=$(TZ=America/Sao_Paulo date +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Cache dos downloads grandes (CVM DFP/ITR, COTAHIST) entre execuções.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.mode.outputs.full == 'true'
        with:
          path: .qt_cache
          key: qt-cache-v2-${{ steps.week.outputs.week }}
          restore-keys: |
            qt-cache-v2-
            qt-cache-

      # Build da noite: espera o arquivo diário oficial da B3 do pregão de hoje (HEAD a cada 5 min, até 150 min).
      # Achou → o pipeline grava a barra oficial de hoje (tickers.json "official" = hoje, data de referência por painel).
      - name: Fechamento oficial do dia (build da noite)
        if: steps.mode.outputs.full == 'true' && (github.event.schedule == '30 22 * * 1-5' || inputs.slot == 'evening')
        timeout-minutes: 155
        run: |
          d=$(TZ=America/Sao_Paulo date +%d%m%Y)
          url="https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_D$d.ZIP"
          for i in $(seq 0 30); do
            if curl -sfI -m 30 "$url" > /tmp/h.txt; then echo "arquivo oficial de $d disponível ($(grep -i last-modified /tmp/h.txt | tr -d '\r'))"; exit 0; fi
            [ "$i" -lt 30 ] && { echo "$(TZ=America/Sao_Paulo date +%H:%M) BRT: arquivo oficial de $d ainda não saiu"; sleep 300; }
          done
          echo "::warning::arquivo oficial de $d não saiu em 150 min (feriado ou atraso): segue com a última barra oficial"

      # Teto do passo: se uma fonte travar além do timeout por etapa (run_all.sh), o deploy segue
      # com os dados já gerados + os do último artefato, em vez de prender a fila até os 90 min do job.
      - name: Pipeline de dados
        if: steps.mode.outputs.full == 'true'
        timeout-minutes: 50
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          QT_SKIP_STEPS: tayl,ectr   # rodam no slow.yml (ECTR mensal, TAYL semanal)
        run: bash pipeline/run_all.sh

      # Também no modo só-frontend: o artefato base pode ser de antes destes arquivos existirem (4 s).
      - name: Arquivos enxutos (preços recentes, semanais, RRG)
        run: python pipeline/build_slim.py

      - name: Testes dos dados gerados (pytest)
        run: python -m pytest -q tests

      - name: Issue de alerta (ALERT)
        if: steps.mode.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/alerts_fired.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "ALERT $(TZ=America/Sao_Paulo date +%Y-%m-%d): regras disparadas" \
              --body-file /tmp/alerts_fired.md --label alert || \
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "ALERT $(TZ=America/Sao_Paulo date +%Y-%m-%d): regras disparadas" \
              --body-file /tmp/alerts_fired.md
          else
            echo "Nenhum alerta disparado."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Lint + testes + build estático
        run: |
          npm ci
          npm run lint
          npm test
          npx next build
          node scripts/csp.mjs out
          node scripts/sw.mjs out
          touch out/.nojekyll
          ! grep -ril bloomberg out/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          # calendar.yml reaproveita este artefato à noite (padrão seria 1 dia: domingo/segunda ficariam sem base)
          retention-days: 3

  deploy:
    # com o gate pulado (push/disparo), o resultado do build decide (sucesso implícito trataria o gate pulado como falha)
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
